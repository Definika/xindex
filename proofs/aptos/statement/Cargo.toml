[package]
name = "xindex-aptos"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Aptos's state verifier's statement: epoch changes signed by more than two thirds of each set's voting power, a ledger info so signed, a successful transaction's info under its accumulator root, and the vault's one `Attested` event under the transaction's event root"

[features]
# Reading fixtures (JSON, with Aptos's own BCS inside) into the statement's input: for the host and the tests, never
# the program.
json = ["dep:serde_json"]
# Test validators that sign: for the tests, never the program.
testkit = []

[dependencies]
# BLS12-381 min-pk with the proof-of-possession tag, the beacon chain's ciphersuite and Aptos's: P1's code, whose hash
# to G2 RFC 9380's vectors pin (`../../finality/tests/hash_to_curve.rs`).
xindex-finality = { path = "../../finality" }
bls12_381 = { version = "=0.8.0", features = ["experimental"] }
group = "0.13"
# SHA3-256, Aptos's hash, and Keccak-256 for the public values; one Keccak-f underneath, SP1's precompile in the zkVM.
tiny-keccak = { version = "2.0.2", features = ["keccak", "sha3"] }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", optional = true }

[dev-dependencies]
xindex-aptos = { path = ".", features = ["json", "testkit"] }
serde_json = "1"
