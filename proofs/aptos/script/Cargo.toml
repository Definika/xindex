[package]
name = "xindex-aptos-script"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Aptos's state verifier's host: runs the program in execute mode on the synthetic claims, prints its key, and proves on a GPU or the prover network"
default-run = "aptos"

[[bin]]
name = "aptos"
path = "src/main.rs"

[dependencies]
sp1-sdk = { version = "6.0.1", features = ["blocking"] }
xindex-aptos = { path = "../statement", features = ["json"] }
serde_json = "1"
hex = "0.4"

[build-dependencies]
sp1-build = "6.0.1"
