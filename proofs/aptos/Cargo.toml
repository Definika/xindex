[workspace]
members = ["statement", "program", "script"]
resolver = "2"

# SP1's accelerated crates, pinned to the SP1 6.2 precompiles as `proofs/` pins them for P1, whose BLS12-381 code the
# statement shares (`../finality/src/bls.rs`): SHA-256 for the hash to G2, BLS12-381's field and G1 arithmetic for the
# aggregate keys and the pairing, and Keccak-f for SHA3-256, Aptos's hash, and for the public values. Off the zkVM they
# build as the upstream crates they patch.
[patch.crates-io]
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.10.9-sp1-6.2.0" }
bls12_381 = { git = "https://github.com/sp1-patches/bls12_381", tag = "patch-0.8.0-sp1-6.2.0" }
tiny-keccak = { git = "https://github.com/sp1-patches/tiny-keccak", tag = "patch-2.0.2-sp1-6.2.0" }
