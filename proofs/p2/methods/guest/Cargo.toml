[package]
name = "xindex-p2-guest"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "P2's guest: checks proofs/finality's statement in RISC Zero and commits P1's public values"

# Built by risc0-build as a workspace of its own, for RISC Zero's target.
[workspace]

[features]
sepolia = ["xindex-finality/sepolia"]

[dependencies]
risc0-zkvm = { version = "3.0.6", default-features = false, features = ["std", "unstable"] }
xindex-finality = { path = "../../../finality" }
bincode = "1.3"

# RISC Zero's accelerated crates, pinned to the versions finality uses (the RISC Zero docs' table of precompiles). Off
# the zkVM they build as the upstream crates they patch.
[patch.crates-io]
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }
bls12_381 = { git = "https://github.com/risc0/zkcrypto-bls12_381", tag = "bls12_381/v0.8.0-risczero.1" }
tiny-keccak = { git = "https://github.com/risc0/tiny-keccak", tag = "tiny-keccak/v2.0.2-risczero.0" }

[profile.release]
lto = "thin"
