[workspace]
members = ["statement", "program", "script"]
resolver = "2"

# SP1's accelerated crates, pinned to the SP1 6.2 precompiles as `proofs/` pins them: SHA-256 for CometBFT's Merkle
# trees and ICS-23's paths, Curve25519 (the `-ng` fork that ed25519-consensus, tendermint-rs's verifier, builds on) for
# the validators' signatures, and Keccak for the public values. Off the zkVM they build as the upstream crates they
# patch.
[patch.crates-io]
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.10.9-sp1-6.2.0" }
curve25519-dalek-ng = { git = "https://github.com/sp1-patches/curve25519-dalek-ng", tag = "patch-4.1.1-sp1-6.2.0" }
tiny-keccak = { git = "https://github.com/sp1-patches/tiny-keccak", tag = "patch-2.0.2-sp1-6.2.0" }
