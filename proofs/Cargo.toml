[workspace]
members = ["finality", "p1-program", "p1-script"]
resolver = "2"

# SP1's accelerated crates, pinned to the SP1 6.x precompiles, as in the prototype. Off the zkVM they build as the
# upstream crates they patch.
[patch.crates-io]
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.10.8-sp1-6.2.0" }
bls12_381 = { git = "https://github.com/sp1-patches/bls12_381", tag = "patch-0.8.0-sp1-6.2.0" }
tiny-keccak = { git = "https://github.com/sp1-patches/tiny-keccak", tag = "patch-2.0.2-sp1-6.2.0" }
