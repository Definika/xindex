[package]
name = "xindex-finality"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "P1: the statement that an Ethereum checkpoint is finalized, checked against a trusted anchor"

[features]
# Sepolia's genesis and fork versions instead of mainnet's, for the testnets: a separate program and program key.
sepolia = []

[dependencies]
sha2 = { version = "0.10.8", features = ["compress"] }
bls12_381 = { version = "0.8.0", features = ["experimental"] }
group = "0.13"
generic-array = "0.14"
tiny-keccak = { version = "2.0", features = ["keccak"] }
serde = { version = "1.0", features = ["derive"] }
serde-big-array = "0.5"
serde_bytes = "0.11"

[dev-dependencies]
ff = "0.13"
