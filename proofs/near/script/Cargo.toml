[package]
name = "xindex-near-script"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "NEAR state verifier's host: runs the program in execute mode on a real input, prints its key, and proves on a GPU or the prover network"
default-run = "near"

[[bin]]
name = "near"
path = "src/main.rs"

[dependencies]
sp1-sdk = { version = "6.0.1", features = ["blocking"] }
xindex-near-finality = { path = "../statement" }
bincode = "1.3"
hex = "0.4"
serde_json = "1"

[build-dependencies]
sp1-build = "6.0.1"
