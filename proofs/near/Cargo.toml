[workspace]
members = ["statement", "program", "script"]
resolver = "2"

# SP1's accelerated crates for SP1 6.x, as `proofs/Cargo.toml` pins them: SHA-256, and Curve25519 for ed25519. Off the
# zkVM they build as the upstream crates they patch.
[patch.crates-io]
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.10.8-sp1-6.2.0" }
curve25519-dalek = { git = "https://github.com/sp1-patches/curve25519-dalek", tag = "patch-4.1.3-sp1-6.2.0" }
