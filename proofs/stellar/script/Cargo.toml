[package]
name = "xindex-stellar-script"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The Stellar state proof's host: execute mode, the program key, and Groth16 proving on a GPU or the prover network"
default-run = "stellar-proof"

[[bin]]
name = "stellar-proof"
path = "src/main.rs"

[dependencies]
sp1-sdk = { version = "6.0.1", features = ["blocking"] }
xindex-stellar = { path = "../statement" }
serde_json = "1"
hex = "0.4"

[build-dependencies]
sp1-build = "6.0.1"
