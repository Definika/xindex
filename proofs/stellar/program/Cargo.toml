[package]
name = "xindex-stellar-program"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The Stellar state proof's zkVM program: checks the statement and commits its public values"

# The program: proves a vault's `attest` and commits what `StellarStateVerifier` decodes. Its key is the verifier's.
[[bin]]
name = "xindex-stellar-program"
path = "src/main.rs"

# For measurement only: the same statement against any expected contract event, so execute mode can run on a real
# mainnet ledger, where no vault exists yet. Its key is never a verifier's.
[[bin]]
name = "xindex-stellar-measure"
path = "src/measure.rs"

[dependencies]
sp1-zkvm = "6.0.1"
xindex-stellar = { path = "../statement" }
