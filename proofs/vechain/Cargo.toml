[workspace]
members = ["statement", "program", "script"]
resolver = "2"

# SP1's accelerated crates for SP1 6.2, as `../cometbft` pins them: secp256k1 for the block signers' recovery, and
# Keccak for the tables' hash chains and the public values. blake2b, VeChain's hash, has no SP1 precompile and runs as
# plain Rust. Off the zkVM they build as the upstream crates they patch.
[patch.crates-io]
k256 = { git = "https://github.com/sp1-patches/elliptic-curves", tag = "patch-k256-13.4-sp1-6.2.0" }
tiny-keccak = { git = "https://github.com/sp1-patches/tiny-keccak", tag = "patch-2.0.2-sp1-6.2.0" }
