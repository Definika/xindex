[package]
name = "xindex-p1-input"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Builds P1's input from a beacon node and an execution node, checking every piece against its root"

[[bin]]
name = "p1-input"
path = "src/main.rs"

[features]
# Sepolia's constants instead of mainnet's, for the testnets (proofs/README.md, "Sepolia").
sepolia = ["xindex-finality/sepolia"]

[dependencies]
xindex-finality = { path = "../finality" }
bls12_381 = { version = "0.8.0", features = ["experimental"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1.0"
bincode = "1.3"
hex = "0.4"
