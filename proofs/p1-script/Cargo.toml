[package]
name = "xindex-p1-script"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "P1's host: runs the program in execute mode, prints its key, and proves on a GPU or the prover network"
default-run = "p1"

[[bin]]
name = "p1"
path = "src/main.rs"

[features]
# Adds up the program's cycle-tracker sections in execute mode; it rebuilds SP1's executor, so it is off by default.
profiling = ["sp1-sdk/profiling"]
# Builds and embeds the program for Sepolia, whose key differs from mainnet's (proofs/README.md, "Sepolia").
sepolia = ["xindex-finality/sepolia"]

[dependencies]
sp1-sdk = { version = "6.0.1", features = ["blocking"] }
xindex-finality = { path = "../finality" }
bincode = "1.3"
hex = "0.4"

[build-dependencies]
sp1-build = "6.0.1"
