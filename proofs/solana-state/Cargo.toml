[package]
name = "xindex-solana-state"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Prototype: what proves a Solana vault's state on Ethereum under Alpenglow, in plain Rust before any zkVM"

# Its own workspace, as proofs/p2 is: a prototype the proofs workspace does not build.
[workspace]

[dependencies]
xindex-finality = { path = "../finality" }
bls12_381 = { version = "0.8.0", features = ["experimental"] }
group = "0.13"
sha2 = "0.10.8"
blake3 = "1.8"

[dev-dependencies]
serde_json = "1"
# Agave's own lattice hash at the release mainnet's Alpenglow ships in (4.3.0): the tests check this crate's against it.
solana-lattice-hash = { version = "=4.3.0", features = ["agave-unstable-api"] }
