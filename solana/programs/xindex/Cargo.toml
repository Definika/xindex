[package]
name = "xindex"
version = "0.1.0"
description = "Xindex index tokens backed in kind, on Solana"
license = "BUSL-1.1"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "xindex"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.2.2", features = ["init-if-needed"] }
anchor-spl = "1.2.2"
solana-sha256-hasher = "3.1.0"
bytemuck = { version = "1.24", features = ["derive", "min_const_generics"] }

[dev-dependencies]
litesvm = "0.18.2"
solana-message = "4.2.4"
solana-transaction = "4.1.5"
solana-signer = "3.0.1"
solana-keypair = "3.1.2"
solana-system-interface = { version = "3.2.0", features = ["bincode"] }
solana-compute-budget-interface = "3.1.0"
solana-account = "4.3"
serde_json = "1"
base64 = "0.22"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
