[package]
name = "ethereum-verifier"
version = "0.1.0"
description = "Xindex v4 Stage B: P1 on Solana, a light client of Ethereum advanced by SP1 proofs, proving a vault message by its receipt"
edition.workspace = true
rust-version.workspace = true
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "ethereum_verifier"

[features]
default = []
no-entrypoint = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.0"
solana-bn254 = "3.2.1"
solana-keccak-hasher = { version = "3.1.0", features = ["sha3"] }
solana-secp256k1-recover = "3.3.0"
solana-sha256-hasher = { version = "3.1.0", features = ["sha2"] }
# Everything a vault chain's programs share, over this crate's `Solana` cryptography (`crypto`).
xindex-core = { path = "../../../crates/xindex-core", default-features = false }

[dev-dependencies]
litesvm = "0.16.0"
solana-message = "4.2.4"
solana-transaction = "4.1.5"
solana-signer = "3.0.1"
solana-keypair = "3.1.2"
serde_json = "1"
solana-account = "4.3.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
