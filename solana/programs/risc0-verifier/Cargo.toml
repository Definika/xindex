[package]
name = "risc0-verifier"
version = "0.1.0"
description = "Xindex v4 Stage B: P2 on Solana, the light client of ethereum-verifier advanced by RISC Zero proofs of the same statement"
edition.workspace = true
rust-version.workspace = true
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "risc0_verifier"

[features]
default = []
no-entrypoint = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.0"
ethereum-verifier = { path = "../ethereum-verifier", features = ["no-entrypoint"] }
xindex-core = { path = "../../../crates/xindex-core", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
