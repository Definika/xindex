[package]
name = "xindex-vault"
version = "0.1.0"
description = "Xindex v4 Stage B: the Solana vault (hackathon build)"
edition.workspace = true
rust-version.workspace = true
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "xindex_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
solana-keccak-hasher = { version = "3.1.0", features = ["sha3"] }
solana-secp256k1-recover = "3.3.0"
# P1's RLP and Merkle-Patricia walk, which read Ethereum's state at the snapshot as they read its receipts.
ethereum-verifier = { path = "../ethereum-verifier", features = ["no-entrypoint"] }

[dev-dependencies]
litesvm = "0.16.0"
solana-message = "4.2.4"
solana-transaction = "4.1.5"
solana-signer = "3.0.1"
solana-keypair = "3.1.2"
solana-signature = "3.4.1"
solana-account = "4.3.2"
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
