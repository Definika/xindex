[package]
name = "xindex-core"
version = "0.1.0"
description = "Xindex v4 Stage B: what every vault chain's Rust programs share, over the chain's own cryptography: Ethereum's encodings and proofs, P1's and P2's Groth16 checks, the light client's rules, and the vault's messages, digests, speed limit and snapshot reads"
edition = "2021"
rust-version = "1.89.0"
license = "MIT"

[lib]
name = "xindex_core"

[features]
# `native`: a pure-Rust `Crypto` for host tests, over the very crates Solana's own host fallbacks run. Off in every
# on-chain build, which depends on this crate with `default-features = false`.
default = ["native"]
native = ["dep:sha2", "dep:sha3", "dep:k256", "dep:solana-bn254"]

[dependencies]
sha2 = { version = "0.10.9", optional = true }
sha3 = { version = "0.10.8", optional = true }
k256 = { version = "0.13.4", optional = true, features = ["ecdsa"] }
solana-bn254 = { version = "3.2.1", optional = true }

[dev-dependencies]
serde_json = "1"

# A workspace of its own: Foundry owns the repository's root, and each chain's workspace (Solana's, NEAR's and
# Stellar's) takes this crate as a path dependency with `default-features = false`.
[workspace]

# The tests run with overflow checks, as every chain's release build runs this code (Solana's, NEAR's, Stellar's): an
# overflow is a panic there, so it must be one here (B2-05).
[profile.release]
overflow-checks = true
