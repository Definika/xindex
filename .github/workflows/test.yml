name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # Only lib/*: the build never reads the dependencies' own nested test submodules.
          submodules: true

      - name: Check submodule commits match foundry.lock
        run: |
          set -euo pipefail
          if ! jq -e 'type == "object" and length > 0' foundry.lock > /dev/null 2>&1; then
            echo "::error::foundry.lock is missing, empty or not a JSON object"
            exit 1
          fi
          failed=0
          checked=0
          while read -r _ dep; do
            checked=$((checked + 1))
            if ! want=$(jq -er --arg p "$dep" '.[$p] | to_entries[0].value | if type == "object" then .rev else . end' foundry.lock 2>/dev/null); then
              echo "::error::$dep has no entry in foundry.lock"
              failed=1
              continue
            fi
            have=$(git ls-tree HEAD "$dep" | awk '{print $3}')
            if [ "$want" != "$have" ]; then
              echo "::error::$dep is committed at ${have:-nothing} but foundry.lock pins $want"
              failed=1
            fi
          done < <(git config -f .gitmodules --get-regexp '^submodule\..*\.path$')
          if [ "$checked" -eq 0 ]; then
            echo "::error::.gitmodules lists no submodules to check"
            exit 1
          fi
          paths=$(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}')
          while read -r pinned; do
            if ! grep -qxF "$pinned" <<< "$paths"; then
              echo "::error::foundry.lock pins $pinned but .gitmodules has no such submodule"
              failed=1
            fi
          done < <(jq -r 'keys[]' foundry.lock)
          exit "$failed"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      # `forge build` prints lint findings but still succeeds, so lint runs on its own and fails on notes too.
      - name: Run Forge lint
        run: forge lint -D notes

      # The separate web app decodes events and errors from these; regenerate them whenever an interface changes.
      - name: Check the committed ABIs are current
        run: |
          set -euo pipefail
          for contract in IndexFactory IndexHub IndexZap MintRequests HybridIndexFactory IHybridIndex XindexVault; do
            forge inspect "$contract" abi --json > "abi/$contract.json"
          done
          git diff --exit-code abi/

      # Pull requests from forks get no secrets; their fork suites skip, so a maintainer re-runs them before merging.
      - name: Require the fork-test RPC on main and on pull requests into it
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' && github.base_ref == 'main' &&
          github.event.pull_request.head.repo.full_name == github.repository)
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
        run: |
          if [ -z "$MAINNET_RPC_URL" ]; then
            echo "::error::Add the MAINNET_RPC_URL repository secret so the mainnet fork tests run."
            exit 1
          fi

      - name: Run Forge tests
        run: forge test -vvv
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}

      # Offline suites only; the fork helpers are covered by them. Every file row must show hit == total for lines,
      # statements, branches and functions, and an empty summary fails.
      - name: Require 100% coverage on every file
        run: |
          set -euo pipefail
          forge coverage --report summary --no-match-path 'test/fork/*' | tee coverage.txt
          python3 - <<'EOF'
          import re
          import sys

          rows, short = 0, []
          for line in open("coverage.txt"):
              cells = [cell.strip() for cell in line.strip().strip("|").split("|")]
              if not re.match(r"^(src|script|test)/", cells[0]):
                  continue
              rows += 1
              if any(hit != total for hit, total in re.findall(r"\((\d+)/(\d+)\)", line)):
                  short.append(cells[0])
          if rows == 0:
              print("::error::the coverage summary lists no files")
              sys.exit(1)
          if short:
              print("::error::coverage is below 100% in " + ", ".join(short))
              sys.exit(1)
          print(f"100% coverage on all {rows} files")
          EOF

      # Wake reads its remappings from foundry.toml, so no second copy is committed. The generated config leaves out
      # only Wake's default folders, so audit/, prototype/, demo/ and vendor/ are added: the PoC tests in audit/ compile
      # only inside the audited commit, prototype/evm is a separate Foundry project that needs via-IR, demo/ is one whose
      # remapping only it knows, and vendor/ holds third-party verifiers with their own import paths, unanalyzed by
      # design; Wake stops on any of their errors before running a detector. `wake detect` exits non-zero on any detection; the documented inline
      # suppressions in src/ still apply.
      - name: Run the Wake detectors on src
        run: |
          set -euo pipefail
          pipx install eth-wake==4.22.1
          wake init config --force
          perl -pi -e 's/^exclude_paths = \[/exclude_paths = ["audit", "prototype", "demo", "vendor", /' wake.toml
          if ! grep -q '^exclude_paths = \["audit", "prototype", "demo", "vendor", ' wake.toml; then
            echo "::error::the generated wake.toml changed shape, so audit/, prototype/, demo/ and vendor/ are not excluded"
            exit 1
          fi
          wake detect all src
