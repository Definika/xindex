[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1000
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
]
# Off on purpose. Forge's default rewrites `new X(...)` in tests into `vm.deployCode`, and an expected revert inside
# that cheatcode ends the test function there, still reported as a pass: every check after `vm.expectRevert` and a
# constructor call was silently skipped (LR-01). With it off, a constructor is an ordinary CREATE and the test goes on.
dynamic_test_linking = false

# Storage layouts in the artifacts, so test/Repo.t.sol can check that HybridHub and the module it delegates to agree
# slot for slot. It changes no bytecode.
extra_output = ["storageLayout"]

# Read-only access, to what the tests and scripts read and nothing else. test/Repo.t.sol checks the repository files
# review findings rest on: the pinned compiler, the CI gates and toolchain, the dependency lock against .gitmodules, the
# ABIs, the docs, and the sources of the other vaults and tools whose constants it compares with Solidity's. The other
# suites read fixtures, and DeployStateVerifier reads the one anchor file it is given, which belongs in `anchors/`. The
# whole project root (`./`) also reached `.env`, which holds the RPC URL and the Etherscan key, and the gitignored
# broadcast records, for every script and test, a dependency's included (A7-18).
fs_permissions = [
    { access = "read", path = "./abi" },
    { access = "read", path = "./anchors" },
    { access = "read", path = "./aptos" },
    { access = "read", path = "./crates" },
    { access = "read", path = "./near" },
    { access = "read", path = "./out" },
    { access = "read", path = "./proofs" },
    { access = "read", path = "./prototype" },
    { access = "read", path = "./script" },
    { access = "read", path = "./src" },
    { access = "read", path = "./stellar" },
    { access = "read", path = "./sui" },
    { access = "read", path = "./test" },
    { access = "read", path = "./tron" },
    { access = "read", path = "./vechain" },
    { access = "read", path = "./vendor" },
    { access = "read", path = "./.github" },
    { access = "read", path = "./.vscode" },
    { access = "read", path = "./.env.example" },
    { access = "read", path = "./.gitignore" },
    { access = "read", path = "./.gitmodules" },
    { access = "read", path = "./CLAUDE.md" },
    { access = "read", path = "./README.md" },
    { access = "read", path = "./foundry.lock" },
    { access = "read", path = "./foundry.toml" },
]

[lint]
# Tests are exercised by `forge test`, not linted: rules like unused-return on `approve` or
# literal-instead-of-constant are noise there.
ignore = ["test/**/*"]
# Rules that conflict with the design rather than flag mistakes:
#   calls-loop / require-revert-in-loop / costly-loop  a basket is processed component by component
#   block-timestamp                      user-supplied swap deadlines are compared to block.timestamp
#   internal-function-used-once          PathLib is shared with the test mocks
#   asm-keccak256                        gas-only; the salt hash runs once per index creation, so plain Solidity wins
exclude_lints = ["calls-loop", "require-revert-in-loop", "costly-loop", "block-timestamp", "internal-function-used-once", "asm-keccak256"]

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 32
# The handler only makes calls that must succeed, so a revert is a liveness regression, not noise (LR-06).
fail_on_revert = true

# Source verification for `forge script ... --verify` and `forge verify-contract`; set ETHERSCAN_API_KEY in .env.
[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}" }
sepolia = { key = "${ETHERSCAN_API_KEY}" }

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
