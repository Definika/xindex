# test/Repo.t.sol pins this file whole by its hash (A7-12): a change here updates that hash in the same commit.
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 100
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
]
# Off on purpose: only the three remappings above are used. Forge's default adds remappings it detects in the
# dependencies' nested submodules, some carrying this checkout's absolute path. Every remapping goes into each
# contract's metadata, so the init-code hashes DeployWeighted pins as the release record (CF-5) would differ on every
# machine, CI included.
auto_detect_remappings = false
# Off on purpose. Forge's default rewrites `new X(...)` in tests into `vm.deployCode`, and an expected revert inside
# that cheatcode ends the test function there, still reported as a pass: every check after `vm.expectRevert` and a
# constructor call was silently skipped (LR-01). With it off, a constructor is an ordinary CREATE and the test goes on.
dynamic_test_linking = false



# Read-only access for test/Repo.t.sol, which checks the repository files review findings rest on: the pinned compiler,
# the CI workflow and both Foundry configs, the dependency lock against .gitmodules, the ABIs and the docs. Only those
# (A7-18): no test or script, nor any dependency's code one runs, can read `.env` or the broadcast records.
fs_permissions = [
    { access = "read", path = "./src" },
    { access = "read", path = "./abi" },
    { access = "read", path = "./script" },
    { access = "read", path = "./.github" },
    { access = "read", path = "./.vscode/settings.json" },
    { access = "read", path = "./foundry.toml" },
    { access = "read", path = "./keeper/foundry.toml" },
    { access = "read", path = "./foundry.lock" },
    { access = "read", path = "./.gitmodules" },
    { access = "read", path = "./.gitignore" },
    { access = "read", path = "./.env.example" },
    { access = "read", path = "./docs/known-limitations.md" },
    { access = "read", path = "./CLAUDE.md" },
]

[lint]
# Tests are exercised by `forge test`, not linted: rules like unused-return on `approve` or
# literal-instead-of-constant are noise there.
ignore = ["test/**/*"]
# Rules that conflict with the design rather than flag mistakes:
#   calls-loop / require-revert-in-loop / costly-loop  a basket is processed component by component
#   block-timestamp                      user-supplied swap deadlines are compared to block.timestamp
#   internal-function-used-once          PathLib is shared with the test mocks
#   asm-keccak256                        gas-only; the salt hash runs once per index creation, so plain Solidity wins
exclude_lints = ["calls-loop", "require-revert-in-loop", "costly-loop", "block-timestamp", "internal-function-used-once", "asm-keccak256"]

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 32
# The handler only makes calls that must succeed, so a revert is a liveness regression, not noise (LR-06).
fail_on_revert = true

# Source verification for `forge script ... --verify` and `forge verify-contract`; set ETHERSCAN_API_KEY in .env.
[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}" }
sepolia = { key = "${ETHERSCAN_API_KEY}" }

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
