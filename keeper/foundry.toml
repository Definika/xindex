# The rebalancer bot's executor, built on its own: it is not part of the protocol, and the repo's gates do not cover
# it. Build with `forge build` from this folder.
[profile.default]
src = "src"
out = "out"
libs = ["../lib"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1000
remappings = [
    "@openzeppelin/contracts/=../lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=../lib/openzeppelin-contracts-upgradeable/contracts/",
    "xindex/=../",
]
allow_paths = [".."]
