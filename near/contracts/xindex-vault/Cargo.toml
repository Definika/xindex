[package]
name = "xindex-vault-near"
version = "0.1.0"
description = "Xindex v4 Stage B: the vault on NEAR, holding NEAR for every index whose shares live on Ethereum, with P1 and P2 compiled in"
edition.workspace = true
rust-version.workspace = true
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `unstable` carries `env::ecrecover`, which a holder's signed snapshot claim needs.
near-sdk = { version = "5.29.1", features = ["unstable"] }
# Everything a vault chain's programs share, over this contract's `Near` cryptography (`crypto`).
xindex-core = { path = "../../../crates/xindex-core", default-features = false }

[dev-dependencies]
near-sdk = { version = "5.29.1", features = ["unit-testing", "unstable"] }
xindex-core = { path = "../../../crates/xindex-core" }
near-workspaces = "0.23.0"
# NEP-616's actions, which near-workspaces has no builder for: deploying the code by its hash and creating the
# deterministic account from its initial state, signed and sent over RPC (the versions near-workspaces runs on).
near-primitives = "0.37.4"
near-crypto = "0.37.4"
near-jsonrpc-client = "0.22.0"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(near)'] }
