[workspace]
members = ["contracts/xindex-vault"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89.0"

# A NEAR contract is small, deterministic Wasm: no unwinding, one codegen unit, and overflow checks kept on.
[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
strip = true
panic = "abort"
overflow-checks = true
