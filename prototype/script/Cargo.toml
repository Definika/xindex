[package]
version = "0.1.0"
name = "xindex-bench-script"
edition = "2021"
default-run = "bench"

[[bin]]
name = "bench"
path = "src/bin/main.rs"

[[bin]]
name = "slice"
path = "src/bin/slice.rs"

[dependencies]
sp1-sdk = { version = "6.0.1", features = ["blocking"] }
bls12_381 = { version = "0.8.0", features = ["experimental"] }
sha2 = "0.10.8"
group = "0.13"
ff = "0.13"
rand = "0.8"

[build-dependencies]
sp1-build = { version = "6.0.1" }
